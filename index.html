<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כספת החלל</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.95) 0 1px, transparent 2px),
        radial-gradient(circle at 25% 76%, rgba(255,255,255,0.75) 0 1px, transparent 2px),
        radial-gradient(circle at 72% 23%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 91% 64%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(96,165,250,0.22), transparent 36%),
        linear-gradient(135deg, #020617 0%, #0f172a 42%, #1e1b4b 72%, #111827 100%);
      background-size: 180px 180px, 260px 260px, 230px 230px, 300px 300px, cover, cover;
    }

    .space-glow {
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(circle at 30% 35%, rgba(59,130,246,0.18), transparent 22%),
        radial-gradient(circle at 70% 65%, rgba(168,85,247,0.16), transparent 26%);
      filter: blur(20px);
      z-index: 0;
    }

    .planet {
      position: fixed;
      width: 170px;
      height: 170px;
      left: 8%;
      bottom: 10%;
      border-radius: 50%;
      background: linear-gradient(145deg, #fbbf24, #f97316 45%, #7c2d12);
      box-shadow: 0 0 50px rgba(251,191,36,0.35);
      opacity: 0.85;
      z-index: 0;
    }

    .planet::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 42px;
      border: 8px solid rgba(255,255,255,0.26);
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      top: 58px;
      left: -30px;
      transform: rotate(-16deg);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 470px);
      padding: 34px 28px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 30px;
      background: rgba(15,23,42,0.58);
      backdrop-filter: blur(18px);
      box-shadow:
        0 25px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 7vw, 52px);
      letter-spacing: -1px;
      text-shadow: 0 0 22px rgba(147,197,253,0.9);
    }

    .subtitle {
      margin: 0 0 26px;
      color: #cbd5e1;
      font-size: 17px;
    }

    .safe {
      width: 280px;
      height: 280px;
      margin: 0 auto 25px;
      position: relative;
      perspective: 1000px;
    }

    .safe-body {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 34px;
      background:
        linear-gradient(145deg, #a1a1aa 0%, #52525b 32%, #18181b 100%);
      border: 10px solid #d4d4d8;
      box-shadow:
        0 0 44px rgba(96,165,250,0.72),
        0 22px 45px rgba(0,0,0,0.35),
        inset 0 0 28px rgba(0,0,0,0.8);
    }

    .inside {
      position: absolute;
      inset: 39px;
      border-radius: 22px;
      background:
        radial-gradient(circle, #fef3c7 0%, #facc15 36%, #f59e0b 72%, #92400e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      z-index: 1;
      box-shadow:
        inset 0 0 35px rgba(0,0,0,0.62),
        0 0 30px rgba(250,204,21,0.35);
    }

    .door {
      position: absolute;
      inset: 18px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 35% 30%, #71717a, #27272a 58%, #09090b 100%);
      border: 7px solid #e4e4e7;
      transform-origin: left center;
      transition: transform 1s cubic-bezier(.2,.9,.2,1);
      z-index: 2;
      box-shadow:
        inset 0 0 22px rgba(255,255,255,0.08),
        inset 0 0 35px rgba(0,0,0,0.85);
    }

    .safe.open .door {
      transform: rotateY(-118deg);
    }

    .handle {
      width: 84px;
      height: 84px;
      border: 11px solid #f4f4f5;
      border-radius: 50%;
      position: absolute;
      top: 72px;
      left: 72px;
      box-shadow:
        inset 0 0 15px #000,
        0 0 18px rgba(255,255,255,0.25);
    }

    .handle::before,
    .handle::after {
      content: "";
      position: absolute;
      background: #f4f4f5;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(255,255,255,0.25);
    }

    .handle::before {
      width: 105px;
      height: 11px;
      top: 25px;
      left: -22px;
    }

    .handle::after {
      width: 11px;
      height: 105px;
      top: -22px;
      left: 25px;
    }

    .panel {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    input {
      width: 158px;
      height: 58px;
      padding: 10px 13px;
      font-size: 30px;
      text-align: center;
      letter-spacing: 8px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      outline: none;
      color: #e0f2fe;
      background: rgba(2,6,23,0.72);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.52);
    }

    input:focus {
      border-color: #93c5fd;
      box-shadow:
        0 0 0 4px rgba(147,197,253,0.16),
        inset 0 0 18px rgba(0,0,0,0.52);
    }

    button {
      height: 58px;
      padding: 0 24px;
      font-size: 20px;
      font-weight: 800;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      color: #111827;
      background: linear-gradient(135deg, #fde047, #f59e0b);
      box-shadow:
        0 0 22px rgba(250,204,21,0.45),
        0 10px 20px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .msg {
      height: 28px;
      margin-top: 16px;
      font-size: 19px;
      font-weight: bold;
      color: #fca5a5;
    }

    .shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(8px); }
      50% { transform: translateX(-8px); }
      75% { transform: translateX(5px); }
    }

    .popup {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2,6,23,0.72);
      backdrop-filter: blur(8px);
    }

    .popup.show {
      display: flex;
    }

    .popup-box {
      width: min(88vw, 390px);
      padding: 34px 26px;
      text-align: center;
      border-radius: 28px;
      background: linear-gradient(145deg, #fff7ed, #fde68a);
      color: #111827;
      box-shadow: 0 25px 90px rgba(0,0,0,0.45);
      animation: pop 0.35s ease;
    }

    .popup-box .big {
      font-size: 56px;
      margin-bottom: 8px;
    }

    .popup-box h2 {
      margin: 0;
      font-size: 38px;
    }

    .popup-box p {
      margin: 10px 0 0;
      font-size: 18px;
    }

    @keyframes pop {
      from { transform: scale(0.86); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="space-glow"></div>
  <div class="planet"></div>

  <main class="card">
    <h1>כספת החלל</h1>
    <p class="subtitle">הכניסו קוד בן 4 ספרות כדי לפתוח את הכספת</p>

    <div class="safe" id="safe">
      <div class="safe-body">
        <div class="inside">⭐</div>
        <div class="door">
          <div class="handle"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <input id="codeInput" type="password" maxlength="4" inputmode="numeric" placeholder="----">
      <button onclick="checkCode()">פתח</button>
    </div>

    <div class="msg" id="msg"></div>
  </main>

  <div class="popup" id="popup">
    <div class="popup-box">
      <div class="big">🚀</div>
      <h2>כל הכבוד!</h2>
      <p>הכספת נפתחה.</p>
    </div>
  </div>

  <script>
    const correctCode = "7873";

    function checkCode() {
      const input = document.getElementById("codeInput");
      const safe = document.getElementById("safe");
      const msg = document.getElementById("msg");
      const popup = document.getElementById("popup");

      if (input.value === correctCode) {
        safe.classList.add("open");
        msg.textContent = "";

        setTimeout(function () {
          popup.classList.add("show");
        }, 650);
      } else {
        msg.textContent = "הקוד לא נכון. נסו שוב.";
        input.value = "";
        input.focus();

        safe.classList.remove("shake");
        void safe.offsetWidth;
        safe.classList.add("shake");
      }
    }

    document.getElementById("codeInput").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 4);
    });

    document.getElementById("codeInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        checkCode();
      }
    });
  </script>
</body>
</html>
