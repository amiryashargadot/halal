<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כספת הכוכבים</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    .safe-wrap {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .safe {
      width: 260px;
      height: 260px;
      position: relative;
      perspective: 1000px;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.16));
    }

    .safe-body {
      width: 100%;
      height: 100%;
      position: relative;
      border: 4px solid #111;
      border-radius: 22px;
      background:
        linear-gradient(135deg, transparent 0 47%, rgba(0,0,0,0.08) 48% 52%, transparent 53%),
        #f8f8f8;
    }

    .inside {
      position: absolute;
      inset: 32px;
      border: 3px dashed #111;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      z-index: 1;
      background: #fffdf5;
    }

    .door {
      position: absolute;
      inset: 18px;
      border: 4px solid #111;
      border-radius: 14px;
      background: #fafafa;
      transform-origin: left center;
      transition: transform 0.9s cubic-bezier(.2,.9,.2,1);
      z-index: 2;
    }

    .safe.open .door {
      transform: rotateY(-118deg);
    }

    .handle {
      position: absolute;
      width: 78px;
      height: 78px;
      border: 5px solid #111;
      border-radius: 50%;
      top: 58px;
      left: 58px;
    }

    .handle::before,
    .handle::after {
      content: "";
      position: absolute;
      background: #111;
      border-radius: 999px;
    }

    .handle::before {
      width: 98px;
      height: 5px;
      top: 31px;
      left: -15px;
    }

    .handle::after {
      width: 5px;
      height: 98px;
      top: -15px;
      left: 31px;
    }

    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      direction: ltr;
    }

    input {
      width: 150px;
      height: 50px;
      border: 2px solid #111;
      background: #fff;
      font-size: 28px;
      letter-spacing: 8px;
      text-align: center;
      outline: none;
      font-weight: 700;
      font-family: "Courier New", monospace;
    }

    input:focus {
      box-shadow: 5px 5px 0 #111;
    }

    button {
      height: 50px;
      padding: 0 20px;
      border: 2px solid #111;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #fff;
      color: #111;
    }

    .msg {
      min-height: 24px;
      font-size: 16px;
      font-weight: 700;
      color: #b91c1c;
      text-align: center;
    }

    .shake {
      animation: shake 0.32s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(7px); }
      50% { transform: translateX(-7px); }
      75% { transform: translateX(4px); }
    }

    .popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.75);
      z-index: 10;
    }

    .popup.show {
      display: flex;
    }

    .popup-box {
      background: #fff;
      border: 3px solid #111;
      padding: 28px 34px;
      box-shadow: 10px 10px 0 #111;
      text-align: center;
    }

    .popup-box h2 {
      margin: 0;
      font-size: 42px;
      color: #111;
    }

    @media (max-width: 640px) {
      .safe {
        width: 220px;
        height: 220px;
      }

      .handle {
        width: 66px;
        height: 66px;
        top: 50px;
        left: 50px;
      }

      .handle::before {
        width: 84px;
        top: 26px;
        left: -14px;
      }

      .handle::after {
        height: 84px;
        top: -14px;
        left: 26px;
      }

      .panel {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

        <circle cx="1460" cy="350" r="5"/><circle cx="1506" cy="310" r="5"/><circle cx="1552" cy="344" r="5"/><circle cx="1584" cy="326" r="5"/>
      </g>

      <g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M58 110 C40 170, 40 215, 74 258" />

        <path d="M1456 472 C1512 502, 1540 558, 1530 628" />
        <path d="M938 146 C892 184, 862 224, 846 274" />
        <path d="M658 104 C724 124, 782 154, 834 198" />
        <path d="M560 658 C622 628, 698 620, 768 640" />
        <path d="M844 746 C900 704, 960 692, 1030 706" />
        <path d="M344 124 C326 188, 334 242, 376 284" />
        <path d="M118 274 C174 250, 208 212, 222 164" />
      </g>
    </svg>

    <div class="center">
      <div class="safe-wrap">
        <div class="safe" id="safe">
          <div class="safe-body">
            <div class="inside">★</div>
            <div class="door">
              <div class="handle"></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <input id="codeInput" type="password" maxlength="4" inputmode="numeric" placeholder="----">
          <button onclick="checkCode()">פתח</button>
        </div>

        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>

  <div class="popup" id="popup">
    <div class="popup-box">
      <h2>כל הכבוד!</h2>
    </div>
  </div>

  <script>
    const correctCode = "7873";

    function checkCode() {
      const input = document.getElementById("codeInput");
      const safe = document.getElementById("safe");
      const msg = document.getElementById("msg");
      const popup = document.getElementById("popup");

      if (input.value === correctCode) {
        safe.classList.add("open");
        msg.textContent = "";

        setTimeout(() => {
          popup.classList.add("show");
        }, 650);
      } else {
        msg.textContent = "הקוד לא נכון";
        input.value = "";
        input.focus();

        safe.classList.remove("shake");
        void safe.offsetWidth;
        safe.classList.add("shake");
      }
    }

    document.getElementById("codeInput").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 4);
    });

    document.getElementById("codeInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        checkCode();
      }
    });
  </script>
</body>
</html>
