<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כספת החלל</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 30%, white 1px, transparent 2px),
        radial-gradient(circle at 70% 20%, white 1px, transparent 2px),
        radial-gradient(circle at 40% 80%, white 1px, transparent 2px),
        linear-gradient(135deg, #020617, #111827, #312e81);
      background-size: 180px 180px, 260px 260px, 220px 220px, cover;
    }

    .wrap {
      text-align: center;
    }

    h1 {
      font-size: 42px;
      text-shadow: 0 0 18px #93c5fd;
    }

    .safe {
      width: 260px;
      height: 260px;
      margin: 25px auto;
      position: relative;
      perspective: 900px;
    }

    .safe-body {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      background: linear-gradient(145deg, #777, #222);
      border: 8px solid #aaa;
      box-shadow: 0 0 35px rgba(147, 197, 253, 0.8), inset 0 0 25px black;
      position: relative;
    }

    .inside {
      position: absolute;
      inset: 38px;
      border-radius: 18px;
      background: radial-gradient(circle, #fde68a, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      z-index: 1;
    }

    .door {
      position: absolute;
      inset: 18px;
      border-radius: 22px;
      background: linear-gradient(145deg, #666, #111);
      border: 7px solid #ddd;
      transform-origin: left center;
      transition: transform 1s ease;
      z-index: 2;
    }

    .safe.open .door {
      transform: rotateY(-120deg);
    }

    .handle {
      width: 80px;
      height: 80px;
      border: 10px solid #eee;
      border-radius: 50%;
      position: absolute;
      top: 70px;
      left: 70px;
    }

    .handle:before,
    .handle:after {
      content: "";
      position: absolute;
      background: #eee;
      border-radius: 8px;
    }

    .handle:before {
      width: 100px;
      height: 10px;
      top: 25px;
      left: -20px;
    }

    .handle:after {
      width: 10px;
      height: 100px;
      top: -20px;
      left: 25px;
    }

    input {
      width: 150px;
      padding: 14px;
      font-size: 30px;
      text-align: center;
      letter-spacing: 8px;
      border: 0;
      border-radius: 12px;
      outline: none;
    }

    button {
      margin-top: 16px;
      padding: 13px 28px;
      font-size: 21px;
      font-weight: bold;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      background: #facc15;
      color: #111;
    }

    .msg {
      margin-top: 15px;
      height: 28px;
      font-size: 20px;
      color: #fca5a5;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>כספת החלל</h1>

    <div class="safe" id="safe">
      <div class="safe-body">
        <div class="inside">⭐</div>
        <div class="door">
          <div class="handle"></div>
        </div>
      </div>
    </div>

    <input id="codeInput" type="password" maxlength="4" inputmode="numeric" placeholder="----">
    <br>
    <button onclick="checkCode()">פתח כספת</button>
    <div class="msg" id="msg"></div>
  </main>

  <script>
    const correctCode = "1234";

    function checkCode() {
      const input = document.getElementById("codeInput");
      const safe = document.getElementById("safe");
      const msg = document.getElementById("msg");

      if (input.value === correctCode) {
        safe.classList.add("open");
        msg.textContent = "";
        setTimeout(() => alert("כל הכבוד!"), 700);
      } else {
        msg.textContent = "הקוד לא נכון. נסה שוב.";
        input.value = "";
        input.focus();
      }
    }

    document.getElementById("codeInput").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 4);
    });

    document.getElementById("codeInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") checkCode();
    });
  </script>
</body>
</html>
